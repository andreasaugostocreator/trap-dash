<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Jersey+15&family=Silkscreen:wght@400;700&family=Tiny5&family=Lilita+One&family=Fredoka:wght@500;600&family=Pixelify+Sans:wght@600&family=Press+Start+2P&family=VT323&family=Micro+5&display=block" rel="stylesheet">
<style>body{margin:0;background:#2a1f3d;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:14px;width:1180px}
.c{background:#f6e7c8;border:5px solid #a8673a;box-shadow:0 0 0 3px #1c1424;padding:12px 16px;color:#1c1424}
.lab{font:12px monospace;color:#6b5a7a}.logo{font-size:44px;line-height:1;margin:6px 0 8px;color:#ff7b8a;text-shadow:3px 0 #1c1424,-3px 0 #1c1424,0 3px #1c1424,0 -3px #1c1424,0 6px #1c1424}.logo span{color:#6c9bff}
.btn{display:inline-block;background:#e8414f;color:#fff;padding:8px 14px;margin:4px 6px 4px 0;box-shadow:0 0 0 3px #1c1424;font-size:20px}.btn.b{background:#3c6fd1}
.p{font-size:17px;margin:6px 0}.n{font-size:24px;background:#120d1a;color:#fff;display:inline-block;padding:2px 10px}</style>
<script>
const sets = [
 ['A · Jersey 10 + Jersey 15', 'Jersey 10', 'Jersey 15', 'Jersey 10'],
 ['B · Silkscreen + Jersey 15', 'Silkscreen', 'Jersey 15', 'Silkscreen'],
 ['C · Lilita One + Fredoka (cartoon)', 'Lilita One', 'Fredoka', 'Lilita One'],
 ['D · Tiny5 + Tiny5', 'Tiny5', 'Tiny5', 'Tiny5'],
 ['E · Jersey 10 + Silkscreen body', 'Jersey 10', 'Silkscreen', 'Jersey 10'],
 ['NOW · Press Start 2P + Pixelify Sans', 'Press Start 2P', 'Pixelify Sans', 'Press Start 2P'],
];
document.write(sets.map(([l, h, b, n]) => `<div class="c"><div class="lab">${l}</div>
<div class="logo" style="font-family:'${h}'">TRAP <span>DASH</span></div>
<span class="btn" style="font-family:'${h}'">Host a party</span><span class="btn b" style="font-family:'${h}'">Join a party</span> <span class="n" style="font-family:'${n}'">12.4</span>
<p class="p" style="font-family:'${b}'">One friend runs. The other springs the traps! Spikes pop out of the floor for a moment — hop over them or wait until they drop.</p></div>`).join(''));
</script>
