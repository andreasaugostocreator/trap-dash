<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block;image-rendering:pixelated}</style><canvas></canvas>
<script type="module">
// App icon ideas, each a 32x32 pixel picture drawn with the game's own sprites, scaled up with nearest-neighbour.
import { CHARS, charFrame, initSprites, SPR } from '../src/sprites.js';
initSprites();
const ch = id => CHARS.find(c => c.id === id);
const mk = () => { const c = document.createElement('canvas'); c.width = c.height = 32; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return [c, x]; };
const R = (x, a, b, w, h, col) => { x.fillStyle = col; x.fillRect(a, b, w, h); };
const sky = (x, cols) => { for (let j = 0; j < 32; j++) R(x, 0, j, 32, 1, cols[Math.min(cols.length - 1, Math.floor(j / (32 / cols.length)))]); };
const disc = (x, cx, cy, r, col) => { for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) if (i * i + j * j <= r * r + r * 0.3) R(x, cx + i, cy + j, 1, 1, col); };
const ink = '#1c1424';
const IDEAS = {};

// 1. Dash Jump: a ninja leaping over glowing spikes against a sunset, with a speed trail
IDEAS.dash = (() => { const [c, x] = mk();
  sky(x, ['#ff6f61', '#ff9466', '#ffbb7a', '#ffdfa0']);
  disc(x, 24, 9, 4, '#fff1b8'); disc(x, 24, 9, 3, '#ffe27a');
  R(x, 0, 24, 32, 1, ink); R(x, 0, 25, 32, 2, '#55a83a'); R(x, 0, 27, 32, 5, '#62331f'); R(x, 0, 27, 32, 1, '#2f7a2c');
  for (let i = 0; i < 4; i++) { const sx = 15 + i * 4; R(x, sx + 1, 20, 1, 1, '#fff'); R(x, sx, 21, 3, 1, '#c8ccd8'); R(x, sx - 1, 22, 5, 2, '#9aa3b5'); R(x, sx - 1, 23, 5, 1, ink); }
  R(x, 13, 22, 18, 1, '#ff5d6a55');
  for (let k = 3; k >= 1; k--) { x.globalAlpha = 0.18 * k; x.drawImage(charFrame(ch('ninja'), 'jump', 1, 0), 3 - k * 3, 6 + k); }
  x.globalAlpha = 1; x.drawImage(charFrame(ch('ninja'), 'jump', 1, 0), 6, 4);
  return c; })();

// 2. The Trap Button: a big red arcade button with a warning sign and the runner sprinting across it
IDEAS.button = (() => { const [c, x] = mk();
  sky(x, ['#2a1f3d', '#33264a', '#3a2c55']);
  for (let i = 0; i < 12; i++) R(x, (i * 7 + 3) % 32, (i * 11 + 2) % 14, 1, 1, i % 3 ? '#8f95d6' : '#fff');
  for (let j = 0; j < 7; j++) { const w = 28 - Math.abs(j - 3) * 0.6; R(x, 16 - w / 2, 24 + j, w, 1, j < 3 ? '#5d6475' : '#3b3f52'); }
  for (let j = 0; j < 10; j++) { const half = Math.round(Math.sqrt(Math.max(0, 11 * 11 - (j - 10) * (j - 10))) * 1.15); R(x, 16 - half, 15 + j, half * 2, 1, j < 3 ? '#ff8a96' : j < 8 ? '#e8414f' : '#a3202e'); }
  R(x, 8, 17, 5, 1, '#ffc0c8'); R(x, 7, 18, 3, 1, '#ffc0c8');
  R(x, 11, 18, 2, 4, '#fff'); R(x, 11, 23, 2, 1, '#fff');
  x.drawImage(charFrame(ch('robot'), 'run1', 1, 0), 16, 0);
  R(x, 9, 4, 5, 1, '#ffffffaa'); R(x, 7, 7, 6, 1, '#ffffffaa'); R(x, 10, 10, 4, 1, '#ffffffaa');
  return c; })();

// 3. TD badge: the logo's letters on a wooden sign
IDEAS.badge = (() => { const [c, x] = mk();
  R(x, 0, 0, 32, 32, '#5fb8ff'); R(x, 0, 22, 32, 10, '#47ad4b'); R(x, 0, 22, 32, 1, '#7bd65a');
  R(x, 2, 5, 28, 20, ink); R(x, 3, 6, 26, 18, '#a8673a'); R(x, 5, 8, 22, 14, '#f6e7c8'); R(x, 5, 8, 22, 1, '#fffaf0');
  for (const [a, b] of [[4, 7], [27, 7], [4, 22], [27, 22]]) R(x, a, b, 1, 1, '#ffe0a6');
  R(x, 7, 25, 2, 6, '#7a4522'); R(x, 23, 25, 2, 6, '#7a4522');
  // T (pink) and D (blue), 3px strokes with a dark drop
  const T = [[0, 0, 8, 3], [2.5, 0, 3, 11]], D = [[0, 0, 3, 11], [0, 0, 6, 2], [0, 9, 6, 2], [6, 1, 2, 9], [5, 1, 2, 2], [5, 8, 2, 2]];
  for (const [a, b, w, h] of T) { R(x, Math.round(7 + a), 11 + b, w, h, ink); R(x, Math.round(7 + a), 10 + b, w, h, '#ff7b8a'); }
  for (const [a, b, w, h] of D) { R(x, 17 + a, 11 + b, w, h, ink); R(x, 17 + a, 10 + b, w, h, '#6c9bff'); }
  R(x, 25, 4, 1, 3, '#ffd84a'); R(x, 24, 5, 3, 1, '#ffd84a');
  return c; })();

// 4. Crusher: the angry crusher slamming down, the runner just escaping to the right
IDEAS.crusher = (() => { const [c, x] = mk();
  sky(x, ['#ffd84a', '#ffc23d', '#ffb52e']);
  R(x, 7, 0, 1, 3, '#5d6475'); R(x, 15, 0, 1, 3, '#5d6475');
  R(x, 1, 3, 20, 15, ink); R(x, 2, 4, 18, 13, '#9aa3b5'); R(x, 2, 4, 18, 2, '#c3c9d6'); R(x, 2, 15, 18, 2, '#5d6475');
  R(x, 4, 7, 5, 1, ink); R(x, 13, 7, 5, 1, ink); R(x, 5, 8, 3, 3, '#fff'); R(x, 14, 8, 3, 3, '#fff'); R(x, 6, 9, 2, 2, ink); R(x, 15, 9, 2, 2, ink);
  R(x, 7, 13, 8, 1, ink);
  for (let i = 0; i < 9; i++) { R(x, 2 + i * 2, 18, 1, 3, '#fff'); R(x, 3 + i * 2, 18, 1, 2, '#c3c9d6'); }
  R(x, 0, 27, 32, 1, ink); R(x, 0, 28, 32, 4, '#8d5a31');
  for (const [a, b, w] of [[2, 24, 3], [6, 25, 4], [11, 24, 3], [15, 25, 2]]) R(x, a, b, w, 1, '#fff6d0');
  x.drawImage(charFrame(ch('explorer'), 'run0', 1, 0), 19, 11);
  R(x, 15, 14, 3, 1, '#ffffffcc'); R(x, 14, 17, 4, 1, '#ffffffcc');
  return c; })();

// 5. Saw night: a big spinning saw under a full moon, the knight vaulting over it
IDEAS.saw = (() => { const [c, x] = mk();
  sky(x, ['#121330', '#191c42', '#222759', '#2e3470']);
  for (let i = 0; i < 16; i++) R(x, (i * 13 + 5) % 32, (i * 7 + 1) % 18, 1, 1, i % 4 ? '#8f95d6' : '#fff');
  disc(x, 25, 6, 4, '#fff6d0'); R(x, 23, 5, 2, 2, '#e3d39c');
  const cx = 16, cy = 25;
  for (let a = 0; a < 16; a++) { const ang = a / 16 * Math.PI * 2; R(x, Math.round(cx + Math.cos(ang) * 9), Math.round(cy + Math.sin(ang) * 9), 2, 2, '#c3c9d6'); }
  disc(x, cx, cy, 8, '#9aa3b5'); disc(x, cx, cy, 6, '#c3c9d6'); disc(x, cx, cy, 2, '#5d6475'); R(x, cx - 4, cy - 5, 3, 1, '#fff');
  R(x, 0, 30, 32, 2, '#245452');
  x.drawImage(charFrame(ch('knight'), 'jump', 1, 0), 11, 1);
  return c; })();

// 6. Runner vs trapper: blue and red halves split by a lightning bolt, the runner and a trap button
IDEAS.versus = (() => { const [c, x] = mk();
  for (let j = 0; j < 32; j++) for (let i = 0; i < 32; i++) R(x, i, j, 1, 1, i + j * 0.6 < 25 ? (j < 16 ? '#5584e6' : '#3c6fd1') : (j < 16 ? '#ff5d6a' : '#e8414f'));
  const bolt = [[17, 0], [14, 9], [18, 10], [12, 21], [16, 22], [10, 32]];
  for (let k = 0; k < bolt.length - 1; k++) { const [a, b] = bolt[k], [c2, d] = bolt[k + 1]; for (let s = 0; s <= 12; s++) { const px = Math.round(a + (c2 - a) * s / 12), py = Math.round(b + (d - b) * s / 12); R(x, px - 1, py, 3, 1, ink); R(x, px, py, 1, 1, '#ffd84a'); } }
  x.drawImage(charFrame(ch('astronaut'), 'run1', 1, 0), 1, 13);
  disc(x, 24, 22, 5, ink); disc(x, 24, 21, 4, '#ffd84a'); disc(x, 24, 20, 3, '#fff6c8'); R(x, 23, 18, 2, 3, '#e8414f'); R(x, 23, 22, 2, 1, '#e8414f');
  R(x, 21, 27, 7, 2, ink);
  return c; })();

// ---------- round two: in the spirit of 1 (a leap over danger, a big sky) and 5 (night, moon, one big hazard)
const stars = (x, n, seed = 1, maxY = 20) => { for (let i = 0; i < n; i++) R(x, (i * 13 + seed * 7) % 32, (i * 7 + seed * 3) % maxY, 1, 1, i % 4 ? '#8f95d6' : '#ffffff'); };
const moon = (x, cx, cy, r) => { disc(x, cx, cy, r + 1, '#fff6d055'); disc(x, cx, cy, r, '#fff6d0'); R(x, cx - 2, cy - 1, 2, 2, '#e3d39c'); R(x, cx + 1, cy + 2, 1, 1, '#e3d39c'); };
const saw = (x, cx, cy, r) => {
  for (let a = 0; a < 18; a++) { const ang = a / 18 * Math.PI * 2; R(x, Math.round(cx + Math.cos(ang) * (r + 1)), Math.round(cy + Math.sin(ang) * (r + 1)), 2, 2, '#c3c9d6'); }
  disc(x, cx, cy, r, '#9aa3b5'); disc(x, cx, cy, r - 2, '#c3c9d6'); disc(x, cx, cy, 2, '#5d6475'); R(x, cx - r + 3, cy - r + 2, 3, 1, '#ffffff');
};
const spikes = (x, x0, y, n, glow) => { for (let i = 0; i < n; i++) { const sx = x0 + i * 4; R(x, sx + 1, y, 1, 1, '#fff'); R(x, sx, y + 1, 3, 1, '#c8ccd8'); R(x, sx - 1, y + 2, 5, 2, '#9aa3b5'); R(x, sx - 1, y + 3, 5, 1, ink); } if (glow) R(x, x0 - 2, y + 2, n * 4 + 2, 1, glow); };
const trail = (x, char, frame, X, Y, dx, dy) => { for (let k = 3; k >= 1; k--) { x.globalAlpha = 0.16 * k; x.drawImage(charFrame(ch(char), frame, 1, 0), X - k * dx, Y + k * dy); } x.globalAlpha = 1; x.drawImage(charFrame(ch(char), frame, 1, 0), X, Y); };
const ground = (x, y, top, mid, dirt) => { R(x, 0, y, 32, 1, ink); R(x, 0, y + 1, 32, 2, top); R(x, 0, y + 3, 32, 32 - y, dirt); R(x, 0, y + 3, 32, 1, mid); };

// 7. Sunset Saw: the ninja leaps a big saw at sunset (1 meets 5)
IDEAS.sunsetSaw = (() => { const [c, x] = mk();
  sky(x, ['#ff6f61', '#ff9466', '#ffbb7a', '#ffdfa0']); disc(x, 24, 8, 4, '#fff1b8'); disc(x, 24, 8, 3, '#ffe27a');
  ground(x, 26, '#55a83a', '#2f7a2c', '#62331f'); saw(x, 17, 26, 7);
  trail(x, 'ninja', 'jump', 9, 2, 3, 1); return c; })();

// 8. Flame Night: the knight jumps a roaring flame column under the moon
IDEAS.flameNight = (() => { const [c, x] = mk();
  sky(x, ['#121330', '#191c42', '#222759', '#2e3470']); stars(x, 14, 2); moon(x, 25, 6, 4);
  ground(x, 27, '#357a72', '#245452', '#1f1833');
  const F = ['#c22b3b', '#ff5a2a', '#ff9a3c', '#ffd84a', '#fff6c8'];
  for (let j = 0; j < 14; j++) { const w = Math.max(1, Math.round(6 - j * 0.35 + Math.sin(j * 1.7) * 1.2)); for (let i = -w; i <= w; i++) R(x, 18 + i, 26 - j, 1, 1, F[Math.min(4, Math.floor((w - Math.abs(i)) / w * 4.5 + j / 10))]); }
  R(x, 15, 27, 7, 2, '#5d6475'); R(x, 12, 12, 13, 15, '#ff7a1a14');
  x.drawImage(charFrame(ch('knight'), 'jump', 1, 0), 4, 5); return c; })();

// 9. Lava Leap: the robot dashes over a lava pit, embers rising
IDEAS.lavaLeap = (() => { const [c, x] = mk();
  sky(x, ['#1a0d0d', '#2b1210', '#3d1812', '#5a2214']);
  for (let i = 0; i < 6; i++) { const cx0 = (i * 9 + 3) % 32, h = 4 + (i * 5) % 6; for (let j = 0; j < h; j++) R(x, cx0 - Math.round((h - j) / 3), j, Math.round((h - j) / 1.5) + 1, 1, '#2a1414'); }
  R(x, 0, 25, 9, 1, ink); R(x, 0, 26, 9, 6, '#3a2a2a'); R(x, 0, 26, 9, 1, '#ff7a1a'); R(x, 24, 25, 8, 1, ink); R(x, 24, 26, 8, 6, '#3a2a2a'); R(x, 24, 26, 8, 1, '#ff7a1a');
  for (let i = 9; i < 24; i++) { const t = 27 + Math.round(Math.sin(i / 2) * 0.8); R(x, i, t, 1, 32 - t, '#c2361b'); R(x, i, t, 1, 1, '#ffd84a'); R(x, i, t - 3, 1, 3, '#ff7a1a22'); }
  for (const [a, b] of [[12, 20], [16, 16], [20, 22], [14, 12], [22, 14]]) { R(x, a, b, 1, 1, '#ffd84a'); R(x, a - 1, b - 1, 3, 3, '#ff7a1a33'); }
  trail(x, 'robot', 'jump', 14, 5, 3, 0); return c; })();

// 10. Cannon Cove: the pirate hops a cannonball over the sea at sunset
IDEAS.cannonCove = (() => { const [c, x] = mk();
  sky(x, ['#ff7b6a', '#ff9e78', '#ffc58a']); disc(x, 8, 12, 5, '#fff1b8');
  R(x, 0, 17, 32, 9, '#1f5f9e'); for (let j = 18; j < 26; j += 2) for (let i = (j * 3) % 7; i < 32; i += 7) R(x, i, j, 3, 1, '#3d8be0'); R(x, 2, 17, 12, 1, '#ffd0b0');
  R(x, 0, 26, 32, 1, ink); R(x, 0, 27, 32, 5, '#7a4b26'); for (let i = 0; i < 32; i += 6) R(x, i, 28, 1, 4, '#5a3a20'); R(x, 0, 27, 32, 1, '#d9a066');
  R(x, 24, 21, 8, 5, ink); R(x, 25, 22, 7, 3, '#3b3f52'); R(x, 23, 22, 2, 3, ink);
  disc(x, 16, 23, 3, ink); R(x, 15, 21, 2, 1, '#9aa3b5'); for (let k = 1; k <= 3; k++) R(x, 19 + k * 2, 23, 1, 1, '#ffffffaa');
  trail(x, 'pirate', 'jump', 12, 2, 3, 1); return c; })();

// 11. Laser Space: the astronaut jumps a laser beam, a ringed planet behind
IDEAS.laser = (() => { const [c, x] = mk();
  sky(x, ['#0c0a1e', '#14112c', '#1d1840']); stars(x, 18, 3, 26);
  disc(x, 7, 9, 5, '#b48cff'); disc(x, 7, 9, 4, '#c9a8ff'); R(x, 0, 9, 15, 1, '#ffd84a'); R(x, 1, 10, 13, 1, '#e0a50e');
  R(x, 0, 27, 32, 5, '#3b3f52'); R(x, 0, 27, 32, 1, '#9aa3b5'); for (let i = 2; i < 32; i += 8) R(x, i, 29, 4, 1, '#5d6475');
  R(x, 27, 21, 5, 6, ink); R(x, 28, 22, 4, 4, '#5d6475'); R(x, 27, 23, 1, 2, '#ff5d6a');
  R(x, 0, 23, 27, 2, '#ff5d6a55'); R(x, 0, 23, 27, 1, '#ff5d6a'); R(x, 0, 24, 27, 1, '#ffd0d4');
  trail(x, 'astronaut', 'jump', 9, 3, 3, 1); return c; })();

// 12. Moon Silhouette: the ninja's leap against a huge full moon over spikes
IDEAS.moonLeap = (() => { const [c, x] = mk();
  sky(x, ['#121330', '#1b1e48', '#272c64']); stars(x, 12, 5);
  disc(x, 16, 14, 11, '#fff6d033'); disc(x, 16, 14, 10, '#fff6d0'); R(x, 10, 9, 3, 2, '#e3d39c'); R(x, 20, 17, 3, 2, '#e3d39c'); R(x, 13, 19, 2, 1, '#e3d39c');
  R(x, 0, 27, 32, 5, '#140f22'); spikes(x, 6, 24, 6, null);
  for (let j = 0; j < 16; j++) for (let i = 0; i < 12; i++) { /* the ninja as a dark silhouette */ }
  x.drawImage(charFrame(ch('ninja'), 'jump', 1, 0), 10, 4);
  return c; })();

// 13. Rope Swing: the explorer swings on a rope over a pit of saws at dusk
IDEAS.ropeSwing = (() => { const [c, x] = mk();
  sky(x, ['#2d2152', '#4a3075', '#83508f', '#d67896']); stars(x, 8, 4, 12);
  R(x, 12, 0, 10, 3, ink); R(x, 13, 0, 8, 2, '#5d6475');
  for (let k = 0; k < 14; k++) { const px = Math.round(17 - k * 0.62), py = 3 + k; R(x, px, py, 1, 1, k % 3 ? '#c99a5e' : '#9a6a3a'); R(x, px + 1, py, 1, 1, '#5a3418'); }
  R(x, 0, 30, 32, 2, '#3d2260'); saw(x, 10, 30, 5); saw(x, 24, 31, 5);
  x.drawImage(charFrame(ch('explorer'), 'jump', 1, 0), 3, 13); return c; })();

// 14. Aurora: the knight leaps over ice spikes under the northern lights
IDEAS.aurora = (() => { const [c, x] = mk();
  sky(x, ['#0e1a33', '#13264a', '#1b3560', '#264a7a']); stars(x, 12, 6, 14);
  for (let i = 0; i < 32; i++) { const y = 6 + Math.round(Math.sin(i / 5) * 3); R(x, i, y, 1, 4, '#5ad1c855'); R(x, i, y + 1, 1, 2, '#7bd65a66'); R(x, i, y - 2, 1, 2, '#b48cff33'); }
  R(x, 0, 27, 32, 5, '#a8c8e8'); R(x, 0, 27, 32, 1, '#ffffff'); R(x, 0, 26, 32, 1, '#1c2a44');
  for (let i = 0; i < 4; i++) { const sx = 15 + i * 4; R(x, sx + 1, 21, 1, 2, '#ffffff'); R(x, sx, 23, 3, 2, '#bfe9ff'); R(x, sx - 1, 25, 5, 1, '#9ad7ff'); }
  trail(x, 'knight', 'jump', 7, 3, 3, 1); return c; })();

// 15. Red Alert: the ninja flies between two saws, warning stripes in the sky
IDEAS.redAlert = (() => { const [c, x] = mk();
  for (let j = 0; j < 32; j++) for (let i = 0; i < 32; i++) R(x, i, j, 1, 1, ((i + j) >> 2) % 2 ? '#e8414f' : '#c22b3b');
  disc(x, 16, 15, 12, '#1c142455'); saw(x, 4, 26, 6); saw(x, 28, 26, 6); R(x, 0, 30, 32, 2, ink);
  R(x, 13, 1, 6, 2, '#ffd84a'); R(x, 15, 3, 2, 4, '#ffd84a'); R(x, 15, 8, 2, 2, '#ffd84a');
  x.drawImage(charFrame(ch('ninja'), 'jump', 1, 0), 10, 10); return c; })();

// 16. Bomb Drop: a bomb with a lit fuse falls toward the robot under a haunted moon
IDEAS.bombDrop = (() => { const [c, x] = mk();
  sky(x, ['#120d1e', '#1c1430', '#2a1f45', '#3a2a5a']); stars(x, 10, 8); moon(x, 6, 6, 4);
  R(x, 0, 27, 32, 5, '#2c2638'); R(x, 0, 27, 32, 1, '#566656'); R(x, 0, 26, 32, 1, ink);
  R(x, 24, 21, 5, 6, '#8a8a9a'); R(x, 25, 20, 3, 1, '#8a8a9a'); R(x, 25, 22, 3, 1, '#5a5a6a');
  disc(x, 21, 8, 4, ink); disc(x, 21, 8, 3, '#3b3f52'); R(x, 19, 6, 2, 1, '#9aa3b5'); R(x, 22, 3, 1, 2, '#c99a5e'); R(x, 23, 1, 2, 2, '#ffd84a'); R(x, 24, 0, 1, 1, '#ff5a2a');
  for (const [a, b] of [[21, 14], [21, 16], [21, 18]]) R(x, a, b, 1, 1, '#ffffff66');
  trail(x, 'robot', 'run1', 6, 11, 3, 0); return c; })();

window.ideas = Object.keys(IDEAS);
window.draw = (id, size) => { const c = document.querySelector('canvas'); c.width = c.height = size; const k = c.getContext('2d'); k.imageSmoothingEnabled = false; k.drawImage(IDEAS[id], 0, 0, size, size); };
// Android crops icons into a circle or squircle: the "maskable" version puts the 32x32 scene in the middle 80% of a
// 40x40 picture and stretches its top row (sky) and bottom row (ground) out to the edges.
window.drawPadded = (id, size) => {
  const src = IDEAS[id], p = document.createElement('canvas'); p.width = p.height = 40; const x = p.getContext('2d'); x.imageSmoothingEnabled = false;
  x.drawImage(src, 0, 0, 32, 1, 0, 0, 40, 4); x.drawImage(src, 0, 31, 32, 1, 0, 36, 40, 4);
  for (let j = 0; j < 32; j++) { x.drawImage(src, 0, j, 1, 1, 0, 4 + j, 4, 1); x.drawImage(src, 31, j, 1, 1, 36, 4 + j, 4, 1); }
  x.drawImage(src, 4, 4);
  const c = document.querySelector('canvas'); c.width = c.height = size; const k = c.getContext('2d'); k.imageSmoothingEnabled = false; k.drawImage(p, 0, 0, size, size);
};
window.ready = true;
</script>
