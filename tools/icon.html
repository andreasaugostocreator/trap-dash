<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block;image-rendering:pixelated}</style><canvas></canvas>
<script type="module">
// The app icon: a 32x32 pixel scene scaled up with nearest-neighbour.
import { CHARS, charFrame, initSprites, SPR } from '../src/sprites.js';
initSprites();
const lo = document.createElement('canvas'); lo.width = lo.height = 32;
const x = lo.getContext('2d'), sky = ['#5fb8ff', '#82c8ff', '#a9daff'];
for (let j = 0; j < 32; j++) { x.fillStyle = sky[Math.min(2, Math.floor(j / 9))]; x.fillRect(0, j, 32, 1); }
x.fillStyle = '#ffffff'; x.fillRect(3, 5, 7, 2); x.fillRect(5, 4, 3, 1); x.fillRect(22, 8, 6, 2); x.fillRect(23, 7, 3, 1);
x.fillStyle = '#7d97d6'; for (let i = 0; i < 32; i++) { const h = Math.max(0, 9 - Math.abs(i - 20) * 0.8); x.fillRect(i, 24 - h, 1, h); }
x.fillStyle = '#ffffff'; x.fillRect(19, 15, 3, 2); x.fillRect(20, 14, 1, 1);
x.fillStyle = '#1c1424'; x.fillRect(0, 23, 32, 1);
x.fillStyle = '#7bd65a'; x.fillRect(0, 24, 32, 2); x.fillStyle = '#47ad4b'; x.fillRect(0, 26, 32, 1); x.fillStyle = '#2c7a32'; x.fillRect(0, 27, 32, 1);
x.fillStyle = '#8d5a31'; x.fillRect(0, 28, 32, 4); x.fillStyle = '#6e4425'; for (const [a, b] of [[3, 29], [10, 30], [17, 29], [25, 30], [29, 28]]) x.fillRect(a, b, 2, 1);
x.drawImage(SPR.popSpike, 0, 0, 16, 9, 17, 15, 16, 9);
x.drawImage(charFrame(CHARS[0], 'jump', 1, 0), 5, 4);
window.draw = size => { const c = document.querySelector('canvas'); c.width = c.height = size; const k = c.getContext('2d'); k.imageSmoothingEnabled = false; k.drawImage(lo, 0, 0, size, size); };
window.ready = true;
</script>
